# fly.toml app configuration file generated for wecom-proxy-blueedu on 2026-04-17T12:30:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wecom-proxy-blueedu'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
